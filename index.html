(function normalizeData(){
  const seen=new Set(), next={};
  db.members=(db.members||[]).map(m=>m&&m.name==='뽀끔'?{...m,image:'images/뽀끔.png'}:m).filter(m=>{if(!m||seen.has(m.name))return false;seen.add(m.name);return true;});
  Object.entries(db.assignments||{}).forEach(([name,a])=>{if(!next[name])next[name]=a;});
  db.assignments=next;
  localStorage.setItem(K,JSON.stringify(db));
})();
let idx=-1, dragMember=-1, dropDept='';
const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveDB(){localStorage.setItem(K,JSON.stringify(db));render()}
function render(){let done=Object.keys(db.assignments).length;$('count').textContent=`${done} / ${db.members.length}`;$('fill').style.width=(done/db.members.length*100||0)+'%';$('members').innerHTML=db.members.map((m,i)=>{let a=db.assignments[m.name];return `<article class="card" draggable="true" ondragstart="dragStart(event,${i})" ondragend="dragEnd(event)" onclick="${a?`openM(${i})`:''}"><button class="edit" onclick="event.stopPropagation();openM(${i})">${a?'수정':'배치'}</button><div class="photo">${m.image?`<img src="${esc(m.image)}" alt="${esc(m.name)}" onclick="event.stopPropagation();openPhoto(${i})">`:''}</div><div class="info"><div class="name">${esc(m.name)}</div>${a?`<span class="badge">${esc(a.dept)} · ${esc(a.role)}</span>`:''}</div></article>`}).join('');renderOrg();}

function renderOrg(){
  const assigned=db.members.filter(m=>db.assignments[m.name]);
  const chiefs=assigned.filter(m=>db.assignments[m.name].role==='팀장');
  const ceo=chiefs[0];
  const ceoBlock=ceo
    ? `<div class="org-company"><b>JDG COMPANY</b><small>IF WORLD · ORGANIZATION</small></div><div class="org-ceo"><img class="ceo-photo" src="${esc(ceo.image||'')}" alt="${esc(ceo.name)}"><span>CEO</span><b>${esc(ceo.name)}</b><small>${esc(db.assignments[ceo.name].dept)} · 팀장</small></div>`
    : `<div class="org-company"><b>JDG COMPANY</b><small>IF WORLD · ORGANIZATION</small></div><div class="org-ceo"><div class="ceo-photo org-avatar">C</div><span>CEO</span><b>CEO</b><small>대표이사</small></div>`;
  const deptMeta=[
    ['전략기획팀','STRATEGY','✦','#baff3f'],['인사팀','HUMAN RESOURCES','●','#58b7ff'],['콘텐츠팀','CONTENT','▣','#c889ff'],['마케팅팀','MARKETING','◆','#ff6380'],['감사팀','AUDIT','◆','#e9bd4d'],
    ['디자인팀','DESIGN','◉','#b47cff'],['재무팀','FINANCE','◒','#35d9cf'],['보안팀','SECURITY','▣','#ff536e'],['고객지원팀','CUSTOMER SUPPORT','◉','#ffad55'],['영업팀','SALES','▥','#48aaff']
  ];
  const units=db.departments.map((d,di)=>{
    const p=db.members.filter(m=>db.assignments[m.name]?.dept===d);
    const meta=deptMeta[di]||[d,'DEPARTMENT','•','#baff3f'];
    const people=p.length?p.map(m=>{const a=db.assignments[m.name];return `<div class="org-person"><div>${m.image?`<img src="${esc(m.image)}" alt="${esc(m.name)}">`:`<div class="org-avatar">${esc(m.name.slice(0,1))}</div>`}</div><b>${esc(m.name)}</b><span>${esc(a.role)}</span></div>`}).join(''):`<div class="org-empty">멤버를 여기에 배치</div>`;
    return `<div class="org-unit"><div class="org-dept" style="--dept-accent:${meta[3]}" data-dept="${esc(d)}" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dropMember(event, '${esc(d).replace(/'/g, "\'")}')"><div class="dept-head"><div class="dept-icon">${meta[2]}</div><div><div class="dept-name">${esc(d)}</div><span class="dept-en">${esc(meta[1])}</span></div><div class="dept-no">${String(di+1).padStart(2,'0')}</div></div><div class="dept-body"><div class="org-people">${people}</div></div></div></div>`;
  }).join('');
  $('orgChart').innerHTML=`<div class="org-board">${ceoBlock}<div class="org-branch">${units}</div></div>`;
}

function openPhoto(i){const m=db.members[i];if(!m||!m.image)return;$('photoViewerName').textContent=m.name;$('photoViewerImg').src=m.image;$('photoViewerImg').alt=m.name;$('photoViewer').classList.add('show')}
function closePhoto(){$('photoViewer').classList.remove('show');$('photoViewerImg').src=''}
function openM(i,deptOverride=''){idx=i;let m=db.members[i],a=db.assignments[m.name]||{};let dept=deptOverride||a.dept||db.departments[0];$('mt').textContent=m.name+' · 배치 설정';$('assignName').textContent=m.name;$('assignImg').src=m.image||'';$('assignImg').alt=m.name;$('ds').innerHTML=db.departments.map(d=>`<option ${dept===d?'selected':''}>${esc(d)}</option>`).join('');$('rs').innerHTML=db.roles.map(r=>`<option ${a.role===r?'selected':''}>${esc(r)}</option>`).join('');$('reason').value=a.reason||'';$('assign').classList.add('show')}
function closeM(){$('assign').classList.remove('show')}
function dragStart(e,i){dragMember=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));e.currentTarget.classList.add('dragging')}
function dragEnd(e){dragMember=-1;document.querySelectorAll('.org-dept.drop-target').forEach(x=>x.classList.remove('drop-target'))}
function allowDrop(e){e.preventDefault();e.dataTransfer.dropEffect='move'}
function dragEnter(e){e.preventDefault();e.currentTarget.classList.add('drop-target')}
function dragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drop-target')}
function dropMember(e,dept){e.preventDefault();e.stopPropagation();document.querySelectorAll('.org-dept.drop-target').forEach(x=>x.classList.remove('drop-target'));let i=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(i)||!db.members[i]) i=dragMember;if(!Number.isInteger(i)||!db.members[i]) return;dragMember=-1;openM(i,dept)}
function save(){let m=db.members[idx];if(!m)return;db.assignments[m.name]={dept:$('ds').value,role:$('rs').value,reason:$('reason').value.trim()};saveDB();closeM()}
function resetAll(){if(confirm('모든 배치 결과와 메모를 초기화할까요?')){db.assignments={};saveDB()}}
function openAdmin(){tab('members',document.querySelector('.tab'));$('admin').classList.add('show')}function closeA(){$('admin').classList.remove('show')}
function tab(k,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');if(k==='members')memberAdmin();else simpleAdmin(k)}
function memberAdmin(){$('adminBody').innerHTML=`<p class="hint">현재 버전은 이 브라우저에 저장됩니다. 사진 교체도 관리자에서 바로 할 수 있습니다.</p>`+db.members.map((m,i)=>`<div class="admin-item"><b>${esc(m.name)}</b><label class="btn">사진 교체<input hidden type="file" accept="image/*" onchange="photo(${i},this)"></label><button class="btn danger" onclick="delMember(${i})">삭제</button></div>`).join('')+`<button class="btn primary" onclick="addMember()">＋ 멤버 추가</button>`}
function simpleAdmin(k){let label=k==='departments'?'부서':'직책';$('adminBody').innerHTML=db[k].map((x,i)=>`<div class="admin-item"><input value="${esc(x)}" onchange="rename('${k}',${i},this.value)"><button class="btn danger" onclick="delItem('${k}',${i})">삭제</button></div>`).join('')+`<button class="btn primary" onclick="addItem('${k}')">＋ ${label} 추가</button>`}
function addMember(){let n=prompt('새 멤버 이름');if(!n?.trim())return;db.members.push({name:n.trim(),image:''});saveDB();memberAdmin()}function delMember(i){if(confirm('삭제할까요?')){delete db.assignments[db.members[i].name];db.members.splice(i,1);saveDB();memberAdmin()}}
function photo(i,input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.members[i].image=r.result;saveDB();memberAdmin()};r.readAsDataURL(f)}
function addItem(k){let l=k==='departments'?'부서':'직책',n=prompt(l+' 이름');if(!n?.trim())return;db[k].push(n.trim());saveDB();simpleAdmin(k)}
function rename(k,i,v){if(!v.trim())return;let old=db[k][i];db[k][i]=v.trim();Object.values(db.assignments).forEach(a=>{if(k==='departments'&&a.dept===old)a.dept=v.trim();if(k==='roles'&&a.role===old)a.role=v.trim()});saveDB();simpleAdmin(k)}
function delItem(k,i){if(confirm('삭제할까요?')){db[k].splice(i,1);saveDB();simpleAdmin(k)}}
render();
</script></body></html>
